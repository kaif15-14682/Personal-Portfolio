name: Site checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm i --no-save vnu-jar@26.11.26
      # .vnu-filters drops SVG 2 features that the checker does not know yet
      - run: java -jar "$(node -p "String(require('vnu-jar'))")" --errors-only --filterfile .vnu-filters index.html

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.2

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress index.html README.md
